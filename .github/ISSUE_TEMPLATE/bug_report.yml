name: Bug report
description: The skill did something wrong (crashed, ignored a command, changed files, wrong report, etc.).
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did the skill do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ran /mock-interview in a Python project
        2. Chose Realistic, Quick
        3. Typed `skip` on question 2
        4. ...
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: "0.2.0"
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Plugin (/plugin install)
        - Manual copy to ~/.claude/skills
  - type: input
    id: env
    attributes:
      label: Claude Code version and OS
      placeholder: "2.1.x · Windows 11"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Please don't paste secrets or private code.
